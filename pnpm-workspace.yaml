allowBuilds:
  esbuild: true
  sharp: true

# la siguiente configuración garantiza que solo se puedan instalar los paquetes publicados hace al menos un día
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - devalue@5.6.3 || 5.6.4 || 5.8.1
  - svelte@5.51.5 || 5.53.5 || 5.55.7
  - minimatch@3.1.3 || 3.1.4 || 9.0.6 || 9.0.7
  - rollup@4.59.0
  - ajv@6.14.0
  - flatted@3.4.0 || 3.4.2
  - h3@1.15.6 || 1.15.9
  - smol-toml@1.6.1
  - astro@5.18.1 || 6.1.6 || 6.3.3 || 6.4.6 || 7.0.4 || 7.0.6 || 7.0.10
  - brace-expansion@1.1.13 || 1.1.16 || 2.0.3 || 2.1.2
  - picomatch@2.3.2 || 4.0.4
  - happy-dom@20.8.8 || 20.8.9
  - defu@6.1.5
  - vite@6.4.2 || 6.4.3 || 7.3.2 || 7.3.5
  - postcss@8.5.10
  - ws@8.20.1 || 8.21.0
  - vitest@4.1.0
  - js-cookie@3.0.6
  - esbuild@0.28.1
  - js-yaml@4.1.2 || 4.3.0
  - '@babel/core@7.29.1'
  - svgo@4.0.2
  - sharp@0.35.0

overrides:
  astro@<6.1.6: ^6.1.6
  astro@>=3.10.0 <6.1.6: ^6.4.8
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  minimatch@>=9.0.0 <9.0.6: ^9.0.6
  minimatch@>=9.0.0 <9.0.7: ^9.0.7
  sharp@<0.35.0: ^0.35.0

# Define los paquetes que forman parte del monorepo.
# Nota: 'src/**' se ha omitido a propósito porque aquí `src/` contiene la aplicación
# y no sub-paquetes con su propio package.json. Si en el futuro conviertes subcarpetas
# de `src/` en paquetes, añade el glob correspondiente.
packages:
  - 'packages/**'
  - 'apps/**'
