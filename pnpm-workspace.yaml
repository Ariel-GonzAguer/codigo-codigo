allowBuilds:
  esbuild: true
  sharp: true

# la siguiente configuración garantiza que solo se puedan instalar los paquetes publicados hace al menos un día
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - devalue@5.6.3
  - svelte@5.51.5
  - minimatch@3.1.3
  - minimatch@9.0.6
  - rollup@4.59.0
  - minimatch@9.0.7
  - minimatch@3.1.4
  - ajv@6.14.0
  - svelte@5.53.5
  - devalue@5.6.4
  - flatted@3.4.0
  - h3@1.15.6
  - h3@1.15.9
  - flatted@3.4.2
  - smol-toml@1.6.1
  - astro@5.18.1
  - brace-expansion@1.1.13
  - brace-expansion@2.0.3
  - picomatch@2.3.2
  - picomatch@4.0.4
  - happy-dom@20.8.9
  - happy-dom@20.8.8
  - defu@6.1.5
  - vite@6.4.2
  - vite@7.3.2
  - postcss@8.5.10
  - astro@6.1.6
  - svelte@5.55.7
  - devalue@5.8.1

overrides:
  astro@<6.1.6: ^6.1.6
  minimatch@>=9.0.0 <9.0.6: ^9.0.6
  minimatch@>=9.0.0 <9.0.7: ^9.0.7

# Define los paquetes que forman parte del monorepo.
# Nota: 'src/**' se ha omitido a propósito porque aquí `src/` contiene la aplicación
# y no sub-paquetes con su propio package.json. Si en el futuro conviertes subcarpetas
# de `src/` en paquetes, añade el glob correspondiente.
packages:
  - 'packages/**'
  - 'apps/**'
